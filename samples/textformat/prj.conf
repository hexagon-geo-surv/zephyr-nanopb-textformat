CONFIG_NANOPB=y
CONFIG_NANOPB_TEXTFORMAT=y

CONFIG_SHELL=y

# A raw text-format argument must reach the handler exactly as typed.
#
# Wildcard expansion rewrites cmd_buff before the handler sees it, so a '*' or
# '?' anywhere in the message -- including inside a quoted string value, which
# the shell has no reason to treat as quoted -- would be expanded against the
# command table. Turn it off; see docs/shell-integration.md.
CONFIG_SHELL_WILDCARD=n

# The cap is the whole command line, not just the message. 256 is the default and
# a text-format message reaches it easily.
CONFIG_SHELL_CMD_BUFF_SIZE=512

# The shell thread runs the handlers. 2048 is the default; the library needs
# under 300 bytes, but this sample's own print buffer and the shell's formatting
# also live here.
CONFIG_SHELL_STACK_SIZE=3072
