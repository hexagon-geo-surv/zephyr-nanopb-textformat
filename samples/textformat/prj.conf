CONFIG_NANOPB=y
CONFIG_NANOPB_TEXTFORMAT=y

CONFIG_SHELL=y

# These are this application's settings, not the library's requirements -- the
# library never sees the shell. They are here rather than in something the
# module ships because the right values depend on how long your messages are.
#
# Note what is deliberately absent: CONFIG_SHELL_WILDCARD. It is not needed for
# a raw leaf at mandatory = 1; see docs/shell-integration.md.

# Caps the whole command line, not just the message. Default 256.
CONFIG_SHELL_CMD_BUFF_SIZE=512

# Default 64, and sized for a keyboard per its own help text. A *pasted* line
# arrives faster than the shell drains it and is silently truncated past that.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512

# The shell thread runs the handlers. 2048 is the default; the library needs
# about 400 bytes, but this sample's 256-byte print buffer and the shell's own
# formatting also live here.
CONFIG_SHELL_STACK_SIZE=3072
