CONFIG_NANOPB=y
CONFIG_NANOPB_TEXTFORMAT=y

CONFIG_SHELL=y

# Everything a raw text-format shell argument needs comes from the module's own
# snippet -- build with `-S nanopb-textformat-shell`, as `just run` does. That
# covers CONFIG_SHELL_WILDCARD=n, the command-buffer and serial RX ring buffer
# sizes, and the cbprintf conversions. See docs/shell-integration.md.
#
# Only what is specific to this sample stays here.

# The shell thread runs the handlers. 2048 is the default; the library needs
# about 400 bytes, but this sample's 256-byte print buffer and the shell's own
# formatting also live here.
CONFIG_SHELL_STACK_SIZE=3072
