common:
  tags: nanopb textformat
  harness: ztest
  timeout: 60
  platform_allow:
    - mps2/an385
    - qemu_x86
    # native_sim is the only target here that compiles against a *host* libc.
    # Zephyr builds module sources at -std=c17, which sets __STRICT_ANSI__, and
    # glibc then hides its POSIX-only declarations -- so a POSIX function the
    # SDK's picolibc happens to declare anyway is an error here and nowhere
    # else. v0.1.0 shipped exactly that bug (strnlen).
    #
    # Linux only, and both widths are listed on purpose: plain native_sim is
    # 32-bit and needs gcc-multilib, which does not exist on aarch64, so an
    # arm64 host can only run the /native/64 variant.
    - native_sim
    - native_sim/native/64

tests:
  # Everything, in the configuration a real consumer would use.
  nanopb_textformat.core: {}

  # Float fields must degrade to PB_TF_ERR_NO_FLOAT, not break the build.
  nanopb_textformat.nofloat:
    extra_configs:
      - CONFIG_NANOPB_TEXTFORMAT_FLOAT=n

  # PB_WITHOUT_64BIT does NOT narrow storage -- the generator never sees the
  # define, so int64_t members stay 8 bytes. What it does is make the codec
  # refuse genuine 8-byte fields (pb_decode.c:452-453), so this entry proves
  # they degrade cleanly. Actual width narrowing is covered by int_size:IS_32
  # on fx_scalars.f_narrow32, which applies in every config.
  nanopb_textformat.no64:
    extra_configs:
      - CONFIG_NANOPB_WITHOUT_64BIT=y

  # The Kconfig minimum: one level of submessage allowed, so the fixture's
  # two-level chain actually hits PB_TF_ERR_DEPTH rather than merely being
  # configured to.
  nanopb_textformat.shallow:
    extra_configs:
      - CONFIG_NANOPB_TEXTFORMAT_MAX_DEPTH=1
