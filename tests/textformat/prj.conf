CONFIG_ZTEST=y

CONFIG_NANOPB=y
CONFIG_NANOPB_TEXTFORMAT=y

# 64-bit fields need full integral conversion; float fields need FP support.
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_FULL_INTEGRAL=y

# roundtrip() holds two 1 KB print buffers, and print-all output for a message
# with a field of every ltype is long.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
