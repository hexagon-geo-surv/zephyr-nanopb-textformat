// Fixture exercising every field shape the library must handle.
//
// Everything is prefixed fx_ deliberately: under nanopb's --c-style an enum
// named `mode` becomes `mode_t`, which collides with POSIX <sys/types.h>.
syntax = "proto3";

// Enum with no negative values -> UENUM ltype.
enum fx_mode {
  FX_MODE_OFF = 0;
  FX_MODE_SLOW = 1;
  FX_MODE_FAST = 2;
}

// Enum with a negative value -> ENUM (signed varint) ltype. proto3 requires the
// first declared value to be zero, so FX_TRIM_NONE leads; nanopb's
// has_negative() scans every value regardless of order
// (nanopb_generator.py:404-408), so this still resolves to signed ENUM.
enum fx_trim {
  FX_TRIM_NONE = 0;
  FX_TRIM_DOWN = -1;
  FX_TRIM_UP = 1;
}

// A message with no fields at all. nanopb emits an empty FIELDLIST, so the
// generated field table is nothing but the sentinel row.
message fx_empty {}

message fx_inner {
  uint32 a = 1;
  int32 b = 2;
}

// Three levels of nesting, to exercise recursion and the depth cap.
message fx_deep3 {
  uint32 v = 1;
}
message fx_deep2 {
  fx_deep3 d3 = 1;
}
message fx_deep1 {
  fx_deep2 d2 = 1;
}

// One field per nanopb ltype, all STATIC SINGULAR.
message fx_scalars {
  int32 f_int32 = 1;
  int64 f_int64 = 2;
  uint32 f_uint32 = 3;
  uint64 f_uint64 = 4;
  sint32 f_sint32 = 5;
  sint64 f_sint64 = 6;
  fixed32 f_fixed32 = 7;
  fixed64 f_fixed64 = 8;
  sfixed32 f_sfixed32 = 9;
  sfixed64 f_sfixed64 = 10;
  bool f_bool = 11;
  float f_float = 12;
  double f_double = 13;
  fx_mode f_uenum = 14;
  fx_trim f_enum = 15;
  string f_string = 16;
  bytes f_bytes = 17;
  bytes f_fixed_bytes = 18;
  int32 f_narrow = 19;
  // int_size:IS_32 on a proto int64 -> int32_t storage. This, not
  // PB_WITHOUT_64BIT, is what actually narrows a 64-bit field's width.
  int64 f_narrow32 = 20;
}

// Every repetition rule in one message, plus oneof.
message fx_shapes {
  uint32 plain_scalar = 1;
  optional uint32 opt_scalar = 2;
  repeated uint32 rep_scalar = 3;
  fx_inner sing_msg = 4;
  optional fx_inner opt_msg = 5;
  repeated fx_inner rep_msg = 6;
  repeated string rep_string = 7;
  repeated uint32 fixed_scalar = 8;

  oneof choice {
    uint32 c_num = 9;
    string c_str = 10;
    fx_inner c_msg = 11;
  }
}

// A oneof under nanopb's anonymous_oneof option. The union is emitted without a
// name, so the FIELDLIST row's tuple becomes (pick, p_num, p_num) instead of
// (pick, p_num, pick.p_num) -- but PB_TF_DEFINE reads only the first two
// elements, and <type>_<union>_<field>_MSGTYPE is emitted the same either way
// (nanopb_generator.py:1519-1526). So this must work identically, including for
// a submessage member.
message fx_anon {
  uint32 keep = 1;
  oneof pick {
    uint32 p_num = 2;
    fx_inner p_msg = 3;
  }
}
