# Everything a shell command taking a raw text-format argument needs.
#
#   west build -S nanopb-textformat-shell -b <board> <app>
#
# Each of these was learned the hard way; docs/shell-integration.md explains
# every one. Apply them individually if you would rather not take the whole set.

# Wildcard expansion rewrites cmd_buff before the handler runs, so a '*' or '?'
# anywhere in the message -- including inside a quoted string value -- is
# expanded against the command table. Silent corruption, no workaround in the
# handler.
CONFIG_SHELL_WILDCARD=n

# Caps the whole command line, not just the message. Text format names every
# field it sets, so it is more verbose than a positional form: a message
# carrying ~18 fields runs to roughly 460 characters, well past the 256 default.
CONFIG_SHELL_CMD_BUFF_SIZE=1024

# The one that bites hardest, because it is silent and looks like a parse bug.
# A *pasted* or piped line arrives faster than the shell drains it, and this
# buffer defaults to 64 bytes -- sized for a keyboard, per its own help text.
# A long line is truncated mid-parse. Typing is slow enough never to notice.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024

# The printer casts every integer to long long and prints %lld/%llu, so full
# integral conversion is needed for *all* integer fields, not only 64-bit ones.
# Both of these are already Zephyr defaults; they are restated here so that a
# project which changed them does not silently lose integer output. The library
# BUILD_ASSERTs on them rather than printing wrong numbers.
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_FULL_INTEGRAL=y
